name: Structure-Site
description: Structure generated docs and create site config for Zensical.

inputs:
  WorkingDirectory:
    description: Working directory for the repository build.
    required: true
  Name:
    description: Optional module name override.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Structure site content and config
      shell: pwsh
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.WorkingDirectory }}
        INPUT_NAME: ${{ inputs.Name }}
      run: '& "${{ github.action_path }}/src/main.ps1" -WorkingDirectory "$env:INPUT_WORKING_DIRECTORY" -Name "$env:INPUT_NAME"'
