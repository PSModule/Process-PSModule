name: Resolve-PSModuleVersion
description: Resolve the next module version from settings, PR labels, GitHub releases, and the PowerShell Gallery.
author: PSModule
branding:
  icon: tag
  color: white

inputs:
  Settings:
    description: The complete settings object as a JSON string (output of Get-PSModuleSettings).
    required: true
  Name:
    description: Module name. When empty, the action uses the repository name.
    required: false
  WorkingDirectory:
    description: Working directory for the script.
    required: false
    default: '.'
  Debug:
    description: Enable debug output.
    required: false
    default: 'false'
  Verbose:
    description: Enable verbose output.
    required: false
    default: 'false'
  EventPath:
    description: Path to the GitHub event JSON file. The default is the standard GitHub event path. Override for testing.
    required: false
    default: ''
  EventJson:
    description: GitHub event payload as a JSON string. When set, this value overrides the event file. Use for testing.
    required: false
    default: ''

outputs:
  Version:
    description: The Major.Minor.Patch portion of the resolved version.
    value: ${{ steps.resolve.outputs.Version }}
  Prerelease:
    description: The prerelease tag, empty when not a prerelease.
    value: ${{ steps.resolve.outputs.Prerelease }}
  FullVersion:
    description: The full version string including version prefix and prerelease tag (for example v1.4.0-alpha001).
    value: ${{ steps.resolve.outputs.FullVersion }}
  ReleaseType:
    description: The resolved release type - Release, Prerelease, or None.
    value: ${{ steps.resolve.outputs.ReleaseType }}
  CreateRelease:
    description: 'true when a release or prerelease should be created from this run.'
    value: ${{ steps.resolve.outputs.CreateRelease }}

runs:
  using: composite
  steps:
    - name: Install-PSModule
      uses: ./_wf/.github/actions/Install-PSModule

    - name: Install PSSemVer
      shell: pwsh
      run: Install-PSResource -Name PSSemVer -Repository PSGallery -TrustRepository

    - name: Resolve module version
      id: resolve
      shell: pwsh
      working-directory: ${{ inputs.WorkingDirectory }}
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        PSMODULE_RESOLVE_PSMODULEVERSION_INPUT_Settings: ${{ inputs.Settings }}
        PSMODULE_RESOLVE_PSMODULEVERSION_INPUT_Name: ${{ inputs.Name }}
        PSMODULE_RESOLVE_PSMODULEVERSION_INPUT_EventJson: ${{ inputs.EventJson }}
        GITHUB_EVENT_PATH: ${{ inputs.EventPath || github.event_path }}
      run: ${{ github.action_path }}/src/main.ps1
