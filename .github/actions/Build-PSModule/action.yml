name: Build-PSModule
description: Build a PowerShell module for the PowerShell Gallery.
author: PSModule

inputs:
  Name:
    description: Name of the module to build. Defaults to the repository name.
    required: false
  OutputFolder:
    description: Path to the folder for the built module.
    required: false
    default: '.PSModule/module'
  Version:
    description: Module version to stamp into the manifest.
    required: true
  Prerelease:
    description: Prerelease tag for the manifest's `PrivateData.PSData.Prerelease`. An empty value omits the prerelease tag.
    required: false
  ArtifactName:
    description: Name of the artifact to upload.
    required: false
    default: module
  WorkingDirectory:
    description: Working directory for the script.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install-PSModule
      uses: ./_wf/.github/actions/Install-PSModule

    - name: Run Build-PSModule
      shell: pwsh
      id: build
      working-directory: ${{ inputs.WorkingDirectory }}
      env:
        PSMODULE_BUILD_PSMODULE_INPUT_Name: ${{ inputs.Name }}
        PSMODULE_BUILD_PSMODULE_INPUT_OutputFolder: ${{ inputs.OutputFolder }}
        PSMODULE_BUILD_PSMODULE_INPUT_Version: ${{ inputs.Version }}
        PSMODULE_BUILD_PSMODULE_INPUT_Prerelease: ${{ inputs.Prerelease }}
      run: ${{ github.action_path }}/src/main.ps1

    - name: Upload module artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.ArtifactName }}
        path: ${{ steps.build.outputs.ModuleOutputFolderPath }}
        if-no-files-found: error
        retention-days: 1
