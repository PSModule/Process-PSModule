name: Test-PSModule
description: Test a PowerShell module before PowerShell Gallery publication.
author: PSModule

inputs:
  Name:
    description: Module name. If omitted, the action uses the repository name.
    required: false
  Settings:
    description: Test type. Use 'Module' or 'SourceCode'.
    required: true
  StepSummary_Mode:
    description: |
      Select the tests to show in the GitHub step summary.
      Use "Full" for all tests, "Failed" for failed tests,
      or "None" to omit the summary.
    required: false
  StepSummary_ShowTestOverview:
    description: |
      Show the test overview table in the GitHub step summary.
    required: false
  StepSummary_ShowConfiguration:
    description: |
      Show configuration details in the GitHub step summary.
    required: false
  Run_Path:
    description: |
      Directories to search for tests, paths to test files, or both.
    required: false
  Run_ExcludePath:
    description: |
      Directories or files to exclude from the run.
    required: false
  Run_ScriptBlock:
    description: |
      ScriptBlocks with tests to run.
    required: false
  Run_Container:
    description: |
      ContainerInfo objects with tests to run.
    required: false
  Run_TestExtension:
    description: |
      Filter that identifies test files.
    required: false
  Run_Exit:
    description: |
      If the test run fails, exit with a nonzero code.
      The run sets `$LASTEXITCODE` even when this option is `$false`.
      If Throw is also enabled, prefer an exception.
    required: false
  Run_Throw:
    description: |
      If the test run fails, throw an exception.
      If Exit is also enabled, prefer an exception.
    required: false
  Run_SkipRun:
    description: |
      Run test discovery without test execution.
      Use PassThru to return an object with all tests.
    required: false
  Run_SkipRemainingOnFailure:
    description: |
      Skip the remaining tests after a failure in the selected scope.
      Options: None, Run, Container, and Block.
    required: false
  Filter_Tag:
    description: |
      Tags on Describe, Context, or It blocks to run.
    required: false
  Filter_ExcludeTag:
    description: |
      Tags on Describe, Context, or It blocks to exclude from the run.
    required: false
  Filter_Line:
    description: |
      Filter parsed tests by file and scriptblock start line
      to avoid errors from expanded names.
      Example: 'C:\tests\file1.Tests.ps1:37'
    required: false
  Filter_ExcludeLine:
    description: |
      Exclude tests by file and scriptblock start line.
      This filter takes precedence over Line.
    required: false
  Filter_FullName:
    description: |
      Full test name with -like wildcards and dot-separated parts.
      Example: '*.describe Get-Item.test1'
    required: false
  CodeCoverage_Enabled:
    description: |
      Enable code coverage.
    required: false
  CodeCoverage_OutputFormat:
    description: |
      Code coverage report format. Pester 6.1 supports JaCoCo or Cobertura.
    required: false
  CodeCoverage_OutputPath:
    description: |
      Code coverage report path, relative to the current directory.
    required: false
  CodeCoverage_OutputEncoding:
    description: |
      Encoding of the output file.
    required: false
  CodeCoverage_Path:
    description: |
      Directories or files for code coverage.
      Without an override, the action uses Path(s) from the general settings.
    required: false
  CodeCoverage_ExcludeTests:
    description: |
      Exclude tests from code coverage.
      This option uses TestFilter from the general configuration.
    required: false
  CodeCoverage_RecursePaths:
    description: |
      Search subdirectories of the directories in the Path option.
    required: false
  CodeCoverage_CoveragePercentTarget:
    description: |
      Target percentage for code coverage.
    required: false
  CodeCoverage_UseBreakpoints:
    description: |
      When false, use the profiler-based tracer instead of breakpoints for code coverage.
    required: false
  CodeCoverage_SingleHitBreakpoints:
    description: |
      Remove each breakpoint after its first hit.
    required: false
  TestResult_Enabled:
    description: |
      Enable test result reports.
    required: false
  TestResult_OutputFormat:
    description: |
      Test result report format: NUnitXml, NUnit2.5, NUnit3, or JUnitXml.
    required: false
  TestResult_OutputPath:
    description: |
      Test result report path, relative to the current directory.
    required: false
  TestResult_OutputEncoding:
    description: |
      Encoding of the output file.
    required: false
  TestResult_TestSuiteName:
    description: |
      Set the name of the root 'test-suite' element.
    required: false
  Should_ErrorAction:
    description: |
      Select the error behavior for Should.
      Use 'Stop' to throw on error,
      or 'Continue' to fail at the end of the test.
    required: false
  Debug_ShowFullErrors:
    description: |
      Show full errors with the internal Pester stack.
      When true, this deprecated property overrides
      Output.StackTraceVerbosity with 'Full'.
    required: false
  Debug_WriteDebugMessages:
    description: |
      Write debug messages to the screen.
    required: false
  Debug_WriteDebugMessagesFrom:
    description: |
      Write debug messages from the selected source.
      Set WriteDebugMessages to true to enable these messages.
      Use like wildcards for multiple sources, or * for all sources.
    required: false
  Debug_ShowNavigationMarkers:
    description: |
      Write paths after each block and test for navigation in VSCode.
    required: false
  Debug_ReturnRawResultObject:
    description: |
      Return the unfiltered result object for development only.
      Do not depend on additional properties.
      Non-public property names change without prior notice.
    required: false
  Output_Verbosity:
    description: |
      Output verbosity: None, Normal, Detailed, or Diagnostic.
    required: false
  Output_StackTraceVerbosity:
    description: |
      Stack trace verbosity: None, FirstLine, Filtered, or Full.
    required: false
  Output_CIFormat:
    description: |
      CI error format in build logs: None, Auto, AzureDevops, or GithubActions.
    required: false
  Output_CILogLevel:
    description: |
      CI log level in build logs: Error or Warning.
    required: false
  Output_RenderMode:
    description: |
      Console output mode: Auto, Ansi, ConsoleColor, or Plaintext.
    required: false
  TestDrive_Enabled:
    description: |
      Enable TestDrive.
    required: false
  TestRegistry_Enabled:
    description: |
      Enable TestRegistry.
    required: false
  Debug:
    description: Enable debug output.
    required: false
    default: 'false'
  Verbose:
    description: Enable verbose output.
    required: false
    default: 'false'
  Version:
    description: GitHub module version to install. The value must be an exact version.
    required: false
  Prerelease:
    description: Allow prerelease versions if available.
    required: false
    default: 'false'
  WorkingDirectory:
    description: Working directory for the action. Tests and outputs use this root folder.
    required: false
    default: '.'

outputs:
  Outcome:
    description: |
      The outcome of the test run.
    value: ${{ steps.test.outcome }}
  Conclusion:
    description: |
      The conclusion of the test run.
    value: ${{ steps.test.conclusion }}
  Executed:
    description: |
      Whether the run executed tests.
    value: ${{ steps.test.outputs.Executed }}
  Result:
    description: |
      Overall Pester result (for example, Passed, Failed).
    value: ${{ steps.test.outputs.Result }}
  FailedCount:
    description: |
      Number of failed tests.
    value: ${{ steps.test.outputs.FailedCount }}
  FailedBlocksCount:
    description: |
      Number of failed blocks.
    value: ${{ steps.test.outputs.FailedBlocksCount }}
  FailedContainersCount:
    description: |
      Number of failed containers.
    value: ${{ steps.test.outputs.FailedContainersCount }}
  PassedCount:
    description: |
      Number of passed tests.
    value: ${{ steps.test.outputs.PassedCount }}
  SkippedCount:
    description: |
      Number of skipped tests.
    value: ${{ steps.test.outputs.SkippedCount }}
  InconclusiveCount:
    description: |
      Number of inconclusive tests.
    value: ${{ steps.test.outputs.InconclusiveCount }}
  NotRunCount:
    description: |
      Number of tests that did not run.
    value: ${{ steps.test.outputs.NotRunCount }}
  TotalCount:
    description: |
      Total count of tests.
    value: ${{ steps.test.outputs.TotalCount }}

runs:
  using: composite
  steps:
    - name: Install-PSModule
      uses: ./_wf/.github/actions/Install-PSModule

    - name: Get test paths
      shell: pwsh
      id: paths
      working-directory: ${{ inputs.WorkingDirectory }}
      env:
        PSMODULE_TEST_PSMODULE_INPUT_Name: ${{ inputs.Name }}
        PSMODULE_TEST_PSMODULE_INPUT_Settings: ${{ inputs.Settings }}
      run: ${{ github.action_path }}/src/main.ps1

    - name: Invoke-Pester
      uses: PSModule/Invoke-Pester@c5494aba3c07d7bfd81bdbbc9f301e8fa4a729fb # v5.1.1
      id: test
      env:
        LocalTestPath: ${{ steps.paths.outputs.LocalTestPath }}
        PSMODULE_TEST_PSMODULE_MODULE_NAME: ${{ steps.paths.outputs.ModuleName }}
        WorkingDirectory: ${{ inputs.WorkingDirectory }}
      with:
        Debug: ${{ inputs.Debug }}
        Verbose: ${{ inputs.Verbose }}
        Version: '[6.1.0,7.0.0)'
        GitHubVersion: ${{ inputs.Version }}
        GitHubPrerelease: ${{ inputs.Prerelease }}
        WorkingDirectory: ${{ inputs.WorkingDirectory }}
        Path: ${{ steps.paths.outputs.TestPath }}
        StepSummary_Mode: ${{ inputs.StepSummary_Mode }}
        StepSummary_ShowTestOverview: ${{ inputs.StepSummary_ShowTestOverview }}
        StepSummary_ShowConfiguration: ${{ inputs.StepSummary_ShowConfiguration }}
        Run_Path: ${{ steps.paths.outputs.CodePath }}
        Run_ExcludePath: ${{ inputs.Run_ExcludePath }}
        Run_ScriptBlock: ${{ inputs.Run_ScriptBlock }}
        Run_Container: ${{ inputs.Run_Container }}
        Run_TestExtension: ${{ inputs.Run_TestExtension }}
        Run_Exit: ${{ inputs.Run_Exit }}
        Run_Throw: ${{ inputs.Run_Throw }}
        Run_SkipRun: ${{ inputs.Run_SkipRun }}
        Run_SkipRemainingOnFailure: ${{ inputs.Run_SkipRemainingOnFailure }}
        Filter_Tag: ${{ inputs.Filter_Tag }}
        Filter_ExcludeTag: ${{ inputs.Filter_ExcludeTag }}
        Filter_Line: ${{ inputs.Filter_Line }}
        Filter_ExcludeLine: ${{ inputs.Filter_ExcludeLine }}
        Filter_FullName: ${{ inputs.Filter_FullName }}
        CodeCoverage_Enabled: ${{ inputs.CodeCoverage_Enabled }}
        CodeCoverage_OutputFormat: ${{ inputs.CodeCoverage_OutputFormat }}
        CodeCoverage_OutputPath: ${{ inputs.CodeCoverage_OutputPath || format('.PSModule/CodeCoverage/PSModuleTest-{0}-{1}-CodeCoverage-Report.xml', inputs.Settings, runner.os) }}
        CodeCoverage_OutputEncoding: ${{ inputs.CodeCoverage_OutputEncoding }}
        CodeCoverage_Path: ${{ inputs.CodeCoverage_Path }}
        CodeCoverage_ExcludeTests: ${{ inputs.CodeCoverage_ExcludeTests }}
        CodeCoverage_RecursePaths: ${{ inputs.CodeCoverage_RecursePaths }}
        CodeCoverage_CoveragePercentTarget: ${{ inputs.CodeCoverage_CoveragePercentTarget }}
        CodeCoverage_UseBreakpoints: ${{ inputs.CodeCoverage_UseBreakpoints }}
        CodeCoverage_SingleHitBreakpoints: ${{ inputs.CodeCoverage_SingleHitBreakpoints }}
        TestResult_Enabled: ${{ inputs.TestResult_Enabled }}
        TestResult_OutputFormat: ${{ inputs.TestResult_OutputFormat }}
        TestResult_OutputPath: ${{ inputs.TestResult_OutputPath || format('.PSModule/TestResult/PSModuleTest-{0}-{1}-TestResult-Report.xml', inputs.Settings, runner.os) }}
        TestResult_OutputEncoding: ${{ inputs.TestResult_OutputEncoding }}
        TestResult_TestSuiteName: PSModuleTest-${{ inputs.Settings }}-${{ runner.os }}
        Should_ErrorAction: ${{ inputs.Should_ErrorAction }}
        Debug_ShowFullErrors: ${{ inputs.Debug_ShowFullErrors }}
        Debug_WriteDebugMessages: ${{ inputs.Debug_WriteDebugMessages }}
        Debug_WriteDebugMessagesFrom: ${{ inputs.Debug_WriteDebugMessagesFrom }}
        Debug_ShowNavigationMarkers: ${{ inputs.Debug_ShowNavigationMarkers }}
        Debug_ReturnRawResultObject: ${{ inputs.Debug_ReturnRawResultObject }}
        Output_Verbosity: ${{ inputs.Output_Verbosity }}
        Output_StackTraceVerbosity: ${{ inputs.Output_StackTraceVerbosity }}
        Output_CIFormat: ${{ inputs.Output_CIFormat }}
        Output_CILogLevel: ${{ inputs.Output_CILogLevel }}
        Output_RenderMode: ${{ inputs.Output_RenderMode }}
        TestDrive_Enabled: ${{ inputs.TestDrive_Enabled }}
        TestRegistry_Enabled: ${{ inputs.TestRegistry_Enabled }}
