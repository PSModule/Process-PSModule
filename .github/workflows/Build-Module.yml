name: Build-Module

on:
  workflow_call:
    inputs:
      Settings:
        type: string
        description: The settings object as a JSON string.
        required: true
      ArtifactName:
        type: string
        description: Name of the artifact to upload.
        required: false
        default: module
      ModuleVersion:
        type: string
        description: The Major.Minor.Patch version to stamp into the built manifest. Empty falls back to '999.0.0'.
        required: false
        default: ''
      ModulePrerelease:
        type: string
        description: Optional prerelease tag to stamp into the built manifest.
        required: false
        default: ''

permissions:
  contents: read # to checkout the repository

jobs:
  Build-Module:
    name: Build-Module
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build module
        uses: PSModule/Build-PSModule@v4.1
        with:
          Name: ${{ fromJson(inputs.Settings).Name }}
          Version: ${{ inputs.ModuleVersion }}
          Prerelease: ${{ inputs.ModulePrerelease }}
          ArtifactName: ${{ inputs.ArtifactName }}
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
