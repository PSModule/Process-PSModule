name: Workflow-Test [Default]

run-name: 'Workflow-Test [Default] - ${{ github.event_name }} [${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}] by @${{ github.actor }}'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'tests/srcTestRepo/**'
      - '!.github/workflows/Release.yml'
      - '!.github/workflows/Linter.yml'
  pull_request:
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'tests/srcTestRepo/**'
      - '!.github/workflows/Release.yml'
      - '!.github/workflows/Linter.yml'
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  WorkflowTestDefault:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/workflow.yml
    secrets:
      PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
      GitHubAppClientId: ${{ secrets.SHELLY_CLIENT_ID }}
      GitHubAppPrivateKey: ${{ secrets.SHELLY_PRIVATE_KEY }}
      TestData: >-
        {
          "secrets": {
            "PSMODULE_TEST_SINGLELINE_SECRET": "${{ secrets.PSMODULE_TEST_SINGLELINE_SECRET }}"
          },
          "variables": {
            "PSMODULE_TEST_VARIABLE": ${{ toJSON(vars.PSMODULE_TEST_VARIABLE) }}
          }
        }
    with:
      WorkingDirectory: tests/srcTestRepo
      ImportantFilePatterns: |
        ^tests/srcTestRepo/
        ^\.github/actions/
        ^\.github/workflows/(?!Release\.yml$|Linter\.yml$)

  VerifyRootFunctionsIndexDefault:
    if: github.event.action != 'closed'
    name: Verify root Functions index [Default]
    runs-on: ubuntu-latest
    needs:
      - WorkflowTestDefault
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: tests/srcTestRepo/.PSModule/docs

      - name: Verify generated Functions index
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourcePath = 'tests/srcTestRepo/src/functions/public/index.md'
          $path = 'tests/srcTestRepo/.PSModule/docs/index.md'
          if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Authored Functions index fixture is missing: $sourcePath"
          }
          if ((Get-Item -LiteralPath $sourcePath).Length -eq 0) {
              throw "Authored Functions index fixture is empty: $sourcePath"
          }
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw 'Expected root Functions index at ' +
                  'tests/srcTestRepo/.PSModule/docs/index.md.'
          }

          $expectedHash = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash
          $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          if ($actualHash -cne $expectedHash) {
              throw 'Generated root Functions index does not preserve the authored Markdown.'
          }
