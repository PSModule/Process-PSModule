name: Get-TestResults

on:
  workflow_call:
    inputs:
      Settings:
        type: string
        description: The complete settings object including test suites.
        required: true
      BeforeAllModuleLocalResult:
        type: string
        description: The workflow result for the BeforeAll-ModuleLocal job.
        required: false
        default: skipped

permissions:
  contents: read # to checkout the repo

jobs:
  Get-TestResults:
    name: Get-TestResults
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Process-PSModule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _wf
          persist-credentials: false

      - name: Get-TestResults
        uses: ./_wf/.github/actions/Get-PesterTestResults
        id: Get-TestResults
        with:
          SourceCodeTestSuites: ${{ toJSON(fromJson(inputs.Settings).Test.SourceCode.Suites) }}
          PSModuleTestSuites: ${{ toJSON(fromJson(inputs.Settings).Test.PSModule.Suites) }}
          ModuleTestSuites: ${{ toJSON(fromJson(inputs.Settings).Test.Module.Suites) }}
          BeforeAllModuleLocalResult: ${{ inputs.BeforeAllModuleLocalResult }}
          Debug: ${{ fromJson(inputs.Settings).Debug }}
          Prerelease: ${{ fromJson(inputs.Settings).Prerelease }}
          Verbose: ${{ fromJson(inputs.Settings).Verbose }}
          Version: ${{ fromJson(inputs.Settings).Version }}
