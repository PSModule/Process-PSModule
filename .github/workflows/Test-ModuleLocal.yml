name: Test-ModuleLocal

on:
  workflow_call:
    secrets:
      TestData:
        description: |
          Optional single-line JSON object with 'secrets' and 'variables' maps. Each entry is exposed
          as an environment variable the module's Pester tests read via $env:<name>; 'secrets' values
          are masked in the logs, 'variables' values are not.
        required: false
    inputs:
      Settings:
        type: string
        description: The settings object as a JSON string.
        required: true

permissions:
  contents: read # to checkout the repo and create releases on the repo

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  Test-ModuleLocal:
    name: Test-${{ matrix.TestName }} (${{ matrix.OSName }})
    runs-on: ${{ matrix.RunsOn }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.Settings).Test.Module.Suites }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Process-PSModule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _wf
          persist-credentials: false

      - name: Download module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module
          path: ${{ fromJson(inputs.Settings).WorkingDirectory }}/outputs/module

      - name: Install-PSModule
        uses: ./_wf/.github/actions/Install-PSModule

      - name: Expose caller-provided test data
        uses: ./_wf/.github/actions/Expose-TestData
        with:
          TestData: ${{ secrets.TestData }}

      - name: Import-Module
        id: import-module
        shell: pwsh
        working-directory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
        run: |
          $name = Get-ChildItem "outputs/module" | Select-Object -ExpandProperty Name
          $path = Install-PSModule -Path "outputs/module/$name" -PassThru
          Write-Warning $path
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Test-ModuleLocal
        uses: PSModule/Invoke-Pester@4ff33199141fdf22568990b6107fe3148ae93a1c # v5.1.0
        with:
          Debug: ${{ fromJson(inputs.Settings).Debug }}
          Prerelease: false
          Verbose: ${{ fromJson(inputs.Settings).Verbose }}
          Version: '[6.1.0,7.0.0)'
          GitHubVersion: ${{ fromJson(inputs.Settings).Version }}
          GitHubPrerelease: ${{ fromJson(inputs.Settings).Prerelease }}
          TestResult_TestSuiteName: ${{ matrix.TestName }}-${{ matrix.OSName }}
          TestResult_Enabled: true
          CodeCoverage_Enabled: true
          Output_Verbosity: Detailed
          CodeCoverage_OutputFormat: JaCoCo
          CodeCoverage_CoveragePercentTarget: 0
          Filter_ExcludeTag: Flaky
          Path: ${{ matrix.TestPath }}
          Run_Path: ${{ steps.import-module.outputs.path }}
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
          Prescript: | # This is to speed up module loading in Pester.
            Install-PSResource -Repository PSGallery -TrustRepository -Name PSCustomObject
            Import-Module -Name '${{ steps.import-module.outputs.name }}' -RequiredVersion '${{ fromJson(inputs.Settings).Publish.Module.Resolution.Version }}'
