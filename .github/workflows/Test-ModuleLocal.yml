name: Test-ModuleLocal

on:
  workflow_call:
    secrets:
      TestSecrets:
        description: |
          Optional JSON object mapping environment variable names to secret values. Each entry is
          exposed as an environment variable that the module's Pester tests read via $env:<name>.
        required: false
    inputs:
      Settings:
        type: string
        description: The settings object as a JSON string.
        required: true
      TestVariables:
        type: string
        description: |
          Optional JSON object mapping environment variable names to NON-SECRET values, exposed as
          environment variables (not masked). The caller builds it from toJSON(vars.<name>).
        required: false
        default: ''

permissions:
  contents: read # to checkout the repo and create releases on the repo

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  Test-ModuleLocal:
    name: Test-${{ matrix.TestName }} (${{ matrix.OSName }})
    runs-on: ${{ matrix.RunsOn }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.Settings).TestSuites.Module }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Expose caller-provided test secrets and variables
        shell: pwsh
        env:
          PSMODULE_TEST_SECRETS: ${{ secrets.TestSecrets }}
          PSMODULE_TEST_VARIABLES: ${{ inputs.TestVariables }}
        run: |
          function Add-EnvFromJson {
              param(
                  [string] $Json,
                  [string] $Source,
                  [switch] $Mask
              )
              if ([string]::IsNullOrWhiteSpace($Json)) { return }
              try {
                  $items = $Json | ConvertFrom-Json -ErrorAction Stop
              } catch {
                  throw "The '$Source' value must be a JSON object mapping names to values. $_"
              }
              foreach ($item in $items.PSObject.Properties) {
                  $name = $item.Name
                  $value = [string]$item.Value
                  if ($Mask) {
                      foreach ($line in ($value -split "`n")) {
                          $line = $line.TrimEnd("`r")
                          if ($line.Length -gt 0) {
                              Write-Host "::add-mask::$line"
                          }
                      }
                  }
                  $delimiter = "GHENV_$([guid]::NewGuid().ToString('N'))"
                  Add-Content -Path $env:GITHUB_ENV -Value "$name<<$delimiter"
                  Add-Content -Path $env:GITHUB_ENV -Value $value
                  Add-Content -Path $env:GITHUB_ENV -Value $delimiter
                  Write-Host "Exposed [$name] as an environment variable."
              }
          }

          Add-EnvFromJson -Json $env:PSMODULE_TEST_SECRETS -Source 'TestSecrets' -Mask
          Add-EnvFromJson -Json $env:PSMODULE_TEST_VARIABLES -Source 'TestVariables'

          if ([string]::IsNullOrWhiteSpace($env:PSMODULE_TEST_SECRETS) -and [string]::IsNullOrWhiteSpace($env:PSMODULE_TEST_VARIABLES)) {
              Write-Host 'No test secrets or variables were provided by the calling workflow.'
          }

      - name: Download module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module
          path: ${{ fromJson(inputs.Settings).WorkingDirectory }}/outputs/module

      - name: Install-PSModuleHelpers
        uses: PSModule/Install-PSModuleHelpers@ed79b6e3aa8c9cd3d30ab2bf02ea6bd4687b9c74 # v1.0.7

      - name: Import-Module
        id: import-module
        shell: pwsh
        working-directory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
        run: |
          $name = Get-ChildItem "outputs/module" | Select-Object -ExpandProperty Name
          $path = Install-PSModule -Path "outputs/module/$name" -PassThru
          Write-Warning $path
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Test-ModuleLocal
        uses: PSModule/Invoke-Pester@266d1cf2532f572470b7c4463fa1072f2bfe4455 # v4.2.5
        with:
          Debug: ${{ fromJson(inputs.Settings).Debug }}
          Prerelease: ${{ fromJson(inputs.Settings).Prerelease }}
          Verbose: ${{ fromJson(inputs.Settings).Verbose }}
          Version: ${{ fromJson(inputs.Settings).Version }}
          TestResult_TestSuiteName: ${{ matrix.TestName }}-${{ matrix.OSName }}
          TestResult_Enabled: true
          CodeCoverage_Enabled: true
          Output_Verbosity: Detailed
          CodeCoverage_OutputFormat: JaCoCo
          CodeCoverage_CoveragePercentTarget: 0
          Filter_ExcludeTag: Flaky
          Path: ${{ matrix.TestPath }}
          Run_Path: ${{ steps.import-module.outputs.path }}
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
          Prescript: | # This is to speed up module loading in Pester.
            Install-PSResource -Repository PSGallery -TrustRepository -Name PSCustomObject
            Import-Module -Name '${{ steps.import-module.outputs.name }}' -RequiredVersion 999.0.0
