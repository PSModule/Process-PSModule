name: Build-Docs

on:
  workflow_call:
    inputs:
      Settings:
        type: string
        description: The complete settings object.
        required: true

permissions:
  contents: read # to checkout the repo

jobs:
  Build-Docs:
    name: Build-Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout Process-PSModule
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _wf
          persist-credentials: false

      - name: Download module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module
          path: ${{ fromJson(inputs.Settings).WorkingDirectory }}/outputs/module

      - name: Document module
        uses: ./_wf/.github/actions/Document-PSModule
        with:
          Name: ${{ fromJson(inputs.Settings).Name }}
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: ${{ fromJson(inputs.Settings).WorkingDirectory }}/outputs/docs
          if-no-files-found: error
          retention-days: 1

      - name: Commit all changes
        uses: PSModule/GitHub-Script@8083ec1f733f00357ee4d0db0c6056686e483bc0 # v1.9.0
        with:
          Debug: ${{ fromJson(inputs.Settings).Debug }}
          Prerelease: ${{ fromJson(inputs.Settings).Prerelease }}
          Verbose: ${{ fromJson(inputs.Settings).Verbose }}
          Version: ${{ fromJson(inputs.Settings).Version }}
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
          Script: |
            # Rename the gitignore file to .gitignore.bak
            if (Test-Path -Path .gitignore) {
                Rename-Item -Path '.gitignore' -NewName '.gitignore.bak' -Force
            }

            try {
                # Add all changes to the repository
                git add .
                git commit -m 'Update documentation'
            } catch {
                Write-Host "No changes to commit"
            }

            # Restore the gitignore file
            if (Test-Path -Path .gitignore.bak) {
                Rename-Item -Path '.gitignore.bak' -NewName '.gitignore' -Force
            }

      - name: Lint documentation
        id: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .github/linters/.markdown-lint.yml
          globs: ${{ fromJson(inputs.Settings).WorkingDirectory }}/outputs/docs/**/*.md

      - name: Summarize documentation lint
        if: always()
        shell: pwsh
        env:
          LINT_OUTCOME: ${{ steps.markdownlint.outcome }}
          WORKING_DIRECTORY: ${{ fromJson(inputs.Settings).WorkingDirectory }}
        run: |
          $docsPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath "$env:WORKING_DIRECTORY/outputs/docs"
          $fileCount = if (Test-Path -Path $docsPath) {
              @(Get-ChildItem -Path $docsPath -Recurse -File -Include '*.md', '*.markdown').Count
          } else {
              0
          }

          @(
              '## Documentation lint'
              ''
              '- Tool: `markdownlint-cli2-action v24.2.0`'
              '- Configuration: `.github/linters/.markdown-lint.yml`'
              "- Files checked: $fileCount"
              "- Result: **$env:LINT_OUTCOME**"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
