name: Test-Module

on:
  workflow_call:
    inputs:
      Settings:
        type: string
        description: The settings object as a JSON string.
        required: true

permissions:
  contents: read # to checkout the repo and create releases on the repo

jobs:
  Test-Module:
    name: Test-Module (${{ matrix.OSName }})
    runs-on: ${{ matrix.RunsOn }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.Settings).Test.PSModule.Suites }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Process-PSModule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _wf
          persist-credentials: false

      - name: Download module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module
          path: ${{ fromJson(inputs.Settings).WorkingDirectory }}/.PSModule/module

      - name: Test-Module
        uses: ./_wf/.github/actions/Test-PSModule
        with:
          Name: ${{ fromJson(inputs.Settings).Name }}
          Debug: ${{ fromJson(inputs.Settings).Debug }}
          Prerelease: ${{ fromJson(inputs.Settings).Prerelease }}
          Verbose: ${{ fromJson(inputs.Settings).Verbose }}
          Version: ${{ fromJson(inputs.Settings).Version }}
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
          Settings: Module

  Lint-Module:
    name: Lint-Module (${{ matrix.OSName }})
    runs-on: ${{ matrix.RunsOn }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.Settings).Test.PSModule.Suites }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download module artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module
          path: ${{ fromJson(inputs.Settings).WorkingDirectory }}/.PSModule/module

      - name: Lint-Module
        uses: PSModule/Invoke-ScriptAnalyzer@9acddbd55ff4634b738be3a219c76e3676aaf1cd # v5.0.1
        with:
          Path: .PSModule/module
          Debug: ${{ fromJson(inputs.Settings).Debug }}
          GitHubPrerelease: ${{ fromJson(inputs.Settings).Prerelease }}
          GitHubVersion: ${{ fromJson(inputs.Settings).Version }}
          Verbose: ${{ fromJson(inputs.Settings).Verbose }}
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
          TestResult_Enabled: true
          TestResult_OutputPath: ${{ fromJson(inputs.Settings).WorkingDirectory }}/.PSModule/TestResult/PSModuleLint-Module-${{ runner.os }}-TestResult-Report.xml
          TestResult_TestSuiteName: PSModuleLint-Module-${{ runner.os }}

      - name: Verify analyzer report location
        shell: pwsh
        working-directory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
        run: |
          $reportPath = '.PSModule/TestResult/PSModuleLint-Module-${{ runner.os }}-TestResult-Report.xml'
          if (-not (Test-Path -Path $reportPath)) {
              throw "Expected analyzer report was not created at $reportPath."
          }

          $legacyArtifactPaths = @(
              'TestResult'
              'CodeCoverage'
              '.temp'
          )

          foreach ($path in $legacyArtifactPaths) {
              if (Test-Path -Path $path) {
                  throw "Legacy root artifact path was created: $path"
              }
          }
