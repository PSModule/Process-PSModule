name: Lint-SourceCode

on:
  workflow_call:
    inputs:
      Settings:
        type: string
        description: The settings object as a JSON string.
        required: true

permissions:
  contents: read # to checkout the repo and create releases on the repo

jobs:
  Lint-SourceCode:
    name: Lint-SourceCode (${{ matrix.OSName }})
    runs-on: ${{ matrix.RunsOn }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.Settings).Test.SourceCode.Suites }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint-SourceCode
        uses: PSModule/Invoke-ScriptAnalyzer@4d633e4df1f1fa575949a328839d33c3a0838765 # v5.0.0
        with:
          Debug: ${{ fromJson(inputs.Settings).Debug }}
          GitHubPrerelease: ${{ fromJson(inputs.Settings).Prerelease }}
          GitHubVersion: ${{ fromJson(inputs.Settings).Version }}
          Verbose: ${{ fromJson(inputs.Settings).Verbose }}
          Path: src
          WorkingDirectory: ${{ fromJson(inputs.Settings).WorkingDirectory }}
          TestResult_Enabled: true
          TestResult_TestSuiteName: PSModuleLint-SourceCode-${{ runner.os }}
